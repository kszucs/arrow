name: Python Minimal Build

on:
  push:
    paths:
      - ".github/workflows/python_minimal.yml"
  pull_request:
    paths:
      - ".github/workflows/python_minimal.yml"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma-separated list of job IDs to run (leave empty to run all)"
        required: false
        type: string

permissions:
  contents: read

env:
  ARCHERY_DEBUG: 1

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    # Run all jobs if not workflow_dispatch or if matrix.id is in input
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.jobs == '' || contains(github.event.inputs.jobs, matrix.id) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: example-python-minimal-build-fedora-conda
            distro: fedora
            build_type: conda
          - id: example-python-minimal-build-ubuntu-venv
            distro: ubuntu
            build_type: venv
    steps:
      - name: Checkout Arrow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Run minimal build example
        run: |
          cd python/examples/minimal_build
          docker compose run --rm minimal-${{ matrix.distro }}-${{ matrix.build_type }}
